<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل جُملي الألمانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141F33;
    --ink-2:#1C2C48;
    --ink-3:#24365A;
    --paper:#F3EEDD;
    --paper-2:#E9E0C4;
    --gold:#C79A4B;
    --gold-dim:#8E713A;
    --red:#A24438;
    --text-on-ink:#EFE9D8;
    --muted:#8C96AC;
    --text-dark:#20200f;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text-on-ink);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .de{
    direction:ltr;
    unicode-bidi:isolate;
    font-family:'IBM Plex Mono',monospace;
  }
  a{color:inherit;}

  /* ===== Header ===== */
  header{
    padding:38px 28px 26px;
    border-bottom:1px solid rgba(199,154,75,0.25);
    background:
      radial-gradient(600px 200px at 85% -40%, rgba(199,154,75,0.14), transparent 60%),
      var(--ink);
  }
  .header-inner{max-width:1180px;margin:0 auto;}
  .brand{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(28px,4vw,42px);
    margin:0;
    letter-spacing:0.2px;
  }
  .brand .de-sub{
    color:var(--gold);
    font-size:16px;
    font-family:'IBM Plex Mono',monospace;
    direction:ltr;
    unicode-bidi:isolate;
  }
  .tagline{
    margin:10px 0 0;
    color:var(--muted);
    max-width:60ch;
    font-size:15px;
    line-height:1.7;
  }
  .toolbar{
    margin-top:24px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  #search{
    flex:1;min-width:220px;
    background:var(--ink-2);
    border:1px solid rgba(199,154,75,0.35);
    color:var(--text-on-ink);
    padding:12px 16px;
    border-radius:var(--radius);
    font-family:'Cairo',sans-serif;
    font-size:15px;
  }
  #search::placeholder{color:var(--muted);}
  #search:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .stopbtn{
    background:transparent;
    border:1px solid var(--red);
    color:#e7b3a9;
    padding:12px 18px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:'Cairo',sans-serif;
    font-size:14px;
    display:flex;align-items:center;gap:8px;
    transition:background .15s ease;
  }
  .stopbtn:hover{background:rgba(162,68,56,0.18);}
  .stopbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ===== Layout ===== */
  .layout{
    max-width:1180px;margin:0 auto;
    display:flex;gap:28px;
    padding:28px;
    align-items:flex-start;
  }
  nav.index{
    width:260px;flex-shrink:0;
    position:sticky;top:20px;
    display:flex;flex-direction:column;gap:4px;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
    padding-inline-end:4px;
  }
  .tab{
    background:transparent;
    border:none;
    border-inline-start:3px solid transparent;
    color:var(--muted);
    text-align:right;
    padding:11px 14px;
    cursor:pointer;
    font-family:'Cairo',sans-serif;
    font-size:14.5px;
    border-radius:0 var(--radius) var(--radius) 0;
    transition:background .15s ease,color .15s ease;
  }
  .tab .de{display:block;font-size:11.5px;color:inherit;opacity:.7;margin-top:2px;}
  .tab:hover{background:var(--ink-2);color:var(--text-on-ink);}
  .tab.active{
    background:var(--ink-2);
    color:var(--gold);
    border-inline-start-color:var(--gold);
  }
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}

  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:34px;}

  section.category{scroll-margin-top:20px;}
  .cat-head{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    border-bottom:1px solid rgba(199,154,75,0.3);
    padding-bottom:10px;margin-bottom:16px;
  }
  .cat-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    color:var(--text-on-ink);
  }
  .cat-head .de{
    color:var(--gold);
    font-size:13px;
    margin-inline-start:10px;
  }
  .playall{
    background:transparent;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    padding:7px 14px;
    font-size:13px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:'Cairo',sans-serif;
    white-space:nowrap;
  }
  .playall:hover{background:rgba(199,154,75,0.12);}
  .playall:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .cards{display:flex;flex-direction:column;gap:10px;}

  .card{
    background:var(--paper);
    color:var(--text-dark);
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex;align-items:center;gap:14px;
    box-shadow:0 1px 0 rgba(0,0,0,0.25) inset;
  }
  .card.playing{background:var(--paper-2);box-shadow:0 0 0 1px var(--gold) inset;}
  .card .txt{flex:1;font-size:15.5px;line-height:1.55;}

  .speakbtn{
    flex-shrink:0;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid rgba(32,32,15,0.25);
    background:var(--ink);
    color:var(--gold);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,transform .1s ease;
  }
  .speakbtn:hover{background:var(--ink-3);}
  .speakbtn:active{transform:scale(.94);}
  .speakbtn:focus-visible{outline:2px solid var(--gold-dim);outline-offset:2px;}
  .speakbtn svg{width:16px;height:16px;fill:currentColor;}

  /* Q/A style */
  .qa{
    background:var(--paper);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .qa + .qa{margin-top:10px;}
  .qrow{display:flex;align-items:center;gap:14px;}
  .qrow .txt{font-weight:600;font-size:15.5px;color:var(--text-dark);}
  .answers{margin-top:10px;padding-inline-start:16px;border-inline-start:2px solid var(--gold-dim);display:flex;flex-direction:column;gap:8px;}
  .arow{display:flex;align-items:center;gap:12px;}
  .arow .txt{font-size:15px;color:#3a3520;}
  .arow .speakbtn{width:32px;height:32px;}
  .arow .speakbtn svg{width:14px;height:14px;}

  /* Location (Wo/Wohin) cards */
  .loc-card{background:var(--paper);border-radius:var(--radius);padding:16px 18px;}
  .loc-card + .loc-card{margin-top:10px;}
  .loc-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--gold-dim);margin-bottom:8px;}
  .loc-row{display:flex;align-items:center;gap:12px;padding:4px 0;}
  .loc-row .tag{
    font-size:10.5px;font-family:'Cairo',sans-serif;font-weight:700;
    color:#fff;background:var(--ink-3);padding:3px 8px;border-radius:20px;
    flex-shrink:0;min-width:44px;text-align:center;
  }
  .loc-row.wohin .tag{background:var(--red);}
  .loc-row .txt{font-size:15px;flex:1;}
  .loc-row .speakbtn{width:32px;height:32px;}
  .loc-row .speakbtn svg{width:14px;height:14px;}

  /* Sequence (Tagesablauf) */
  ol.seq{list-style:none;margin:0;padding:0;counter-reset:step;display:flex;flex-direction:column;gap:8px;}
  ol.seq li{
    counter-increment:step;
    background:var(--paper);border-radius:var(--radius);
    padding:12px 16px;display:flex;align-items:center;gap:14px;
  }
  ol.seq li::before{
    content:counter(step);
    font-family:'Fraunces',serif;font-weight:700;color:var(--gold-dim);
    font-size:15px;flex-shrink:0;width:20px;text-align:center;
  }
  ol.seq li .txt{flex:1;font-size:15px;}

  .empty-msg{
    color:var(--muted);text-align:center;padding:60px 20px;font-size:15px;
  }

  footer{
    max-width:1180px;margin:0 auto;padding:20px 28px 50px;
    color:var(--muted);font-size:12.5px;text-align:center;
  }

  @media (max-width:860px){
    .layout{flex-direction:column;padding:18px;gap:18px;}
    nav.index{
      width:100%;flex-direction:row;overflow-x:auto;overflow-y:visible;
      position:sticky;top:0;background:var(--ink);
      max-height:none;padding:8px 0;z-index:5;
      border-bottom:1px solid rgba(199,154,75,0.2);
    }
    .tab{
      flex-shrink:0;border-inline-start:none;border-bottom:3px solid transparent;
      border-radius:var(--radius);
    }
    .tab.active{border-bottom-color:var(--gold);}
    .tab .de{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>دليل جُملي الألمانية</h1>

    <div class="toolbar">
      <input id="search" type="text" placeholder="دوّر على جملة أو كلمة… (بالعربي أو الألماني)">
      <button class="stopbtn" id="stopBtn" type="button">

    </div>
  </div>
</header>

<div class="layout">
  <nav class="index" id="index"></nav>

</div>

/* ---------- Speech ---------- */
let germanVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  const de = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('de'));
  germanVoice = de.find(v => /google/i.test(v.name)) || de.find(v => /de-DE/i.test(v.lang)) || de[0] || null;
}
pickVoice();
if (typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = pickVoice;

function cleanForSpeech(t){ return t.replace(/\s*\/\s*/g, '. '); }

function speak(text, el, onEnd){
  if (!('speechSynthesis' in window)) { alert('متصفحك لا يدعم النطق الصوتي.'); return; }
  speechSynthesis.cancel();
  document.querySelectorAll('.card.playing').forEach(c => c.classList.remove('playing'));
  const utter = new SpeechSynthesisUtterance(cleanForSpeech(text));
  utter.lang = 'de-DE';
  if (germanVoice) utter.voice = germanVoice;
  utter.rate = 0.93;
  utter.pitch = 1;
  if (el) el.classList.add('playing');
  utter.onend = () => { if (el) el.classList.remove('playing'); if (onEnd) onEnd(); };
  utter.onerror = () => { if (el) el.classList.remove('playing'); };
  speechSynthesis.speak(utter);
}

function playSequence(texts, i=0){
  if (i >= texts.length) return;
  speak(texts[i], null, () => playSequence(texts, i+1));
}

document.getElementById('stopBtn').addEventListener('click', () => {
  speechSynthesis.cancel();
  document.querySelectorAll('.card.playing').forEach(c => c.classList.remove('playing'));
});

/* ---------- Rendering ---------- */
const speakBtnHTML = `<button class="speakbtn" type="button" aria-label="استمع">${ICON_PLAY}</button>`;

function makeCard(text){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<span class="txt de">${text}</span>${speakBtnHTML}`;
  card.querySelector('.speakbtn').addEventListener('click', () => speak(text, card));
  card.dataset.search = text.toLowerCase();
  return card;
}

function makeQA(item){
  const wrap = document.createElement('div');
  wrap.className = 'qa';
  const qRow = document.createElement('div');
  qRow.className = 'qrow';
  qRow.innerHTML = `<span class="txt de">${item.q}</span>${speakBtnHTML}`;
  qRow.querySelector('.speakbtn').addEventListener('click', () => speak(item.q, wrap));
  wrap.appendChild(qRow);

  const answers = document.createElement('div');
  answers.className = 'answers';
  item.a.forEach(a => {
    const row = document.createElement('div');
    row.className = 'arow';
    row.innerHTML = `<span class="txt de">${a}</span><button class="speakbtn" type="button" aria-label="استمع">${ICON_PLAY}</button>`;
    row.querySelector('.speakbtn').addEventListener('click', () => speak(a, wrap));
    answers.appendChild(row);
  });
  wrap.appendChild(answers);
  wrap.dataset.search = (item.q + ' ' + item.a.join(' ')).toLowerCase();
  return wrap;
}

function makeLocation(item){
  const wrap = document.createElement('div');
  wrap.className = 'loc-card';
  wrap.innerHTML = `<div class="loc-title">${item.place}</div>`;
  const woRow = document.createElement('div');
  woRow.className = 'loc-row';
  woRow.innerHTML = `<span class="tag">Wo</span><span class="txt de">${item.wo}</span><button class="speakbtn" type="button" aria-label="استمع">${ICON_PLAY}</button>`;
  woRow.querySelector('.speakbtn').addEventListener('click', () => speak(item.wo, wrap));
  wrap.appendChild(woRow);
  item.wohin.forEach(w => {
    const row = document.createElement('div');
    row.className = 'loc-row wohin';
    row.innerHTML = `<span class="tag">Wohin</span><span class="txt de">${w}</span><button class="speakbtn" type="button" aria-label="استمع">${ICON_PLAY}</button>`;
    row.querySelector('.speakbtn').addEventListener('click', () => speak(w, wrap));
    wrap.appendChild(row);
  });
  wrap.dataset.search = (item.place + ' ' + item.wo + ' ' + item.wohin.join(' ')).toLowerCase();
  return wrap;
}

function makeSequence(items){
  const ol = document.createElement('ol');
  ol.className = 'seq';
  items.forEach(text => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="txt de">${text}</span>${speakBtnHTML}`;
    li.querySelector('.speakbtn').addEventListener('click', () => speak(text, li));
    li.dataset.search = text.toLowerCase();
    ol.appendChild(li);
  });
  return ol;
}

function allTextsOf(cat){
  if (cat.type === 'flat') return cat.items;
  if (cat.type === 'sequence') return cat.items;
  if (cat.type === 'qa') return cat.items.flatMap(i => [i.q, ...i.a]);
  if (cat.type === 'location') return cat.items.flatMap(i => [i.wo, ...i.wohin]);
  return [];
}

const nav = document.getElementById('index');
const main = document.getElementById('main');

DATA.forEach(cat => {
  const tab = document.createElement('button');
  tab.className = 'tab';
  tab.innerHTML = `${cat.ar}<span class="de">${cat.de}</span>`;
  tab.addEventListener('click', () => {
    document.getElementById('sec-' + cat.id).scrollIntoView({behavior:'smooth', block:'start'});
  });
  nav.appendChild(tab);

  const section = document.createElement('section');
  section.className = 'category';
  section.id = 'sec-' + cat.id;

  const head = document.createElement('div');
  head.className = 'cat-head';
  head.innerHTML = `<h2>${cat.ar}<span class="de">${cat.de}</span></h2>`;
  const playAllBtn = document.createElement('button');
  playAllBtn.className = 'playall';
  playAllBtn.type = 'button';
  playAllBtn.textContent = 'تشغيل الفئة كاملة';
  playAllBtn.addEventListener('click', () => playSequence(allTextsOf(cat)));
  head.appendChild(playAllBtn);
  section.appendChild(head);

  const body = document.createElement('div');
  body.className = 'cards';

  if (cat.type === 'flat') {
    cat.items.forEach(t => body.appendChild(makeCard(t)));
  } else if (cat.type === 'qa') {
    cat.items.forEach(it => body.appendChild(makeQA(it)));
  } else if (cat.type === 'location') {
    cat.items.forEach(it => body.appendChild(makeLocation(it)));
  } else if (cat.type === 'sequence') {
    body.appendChild(makeSequence(cat.items));
  }

  section.appendChild(body);
  main.appendChild(section);
});

nav.children[0].classList.add('active');

/* highlight active tab on scroll */
const sections = Array.from(document.querySelectorAll('section.category'));
const tabs = Array.from(nav.children);
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting){
      const idx = sections.indexOf(e.target);
      tabs.forEach(t => t.classList.remove('active'));
      if (idx > -1) tabs[idx].classList.add('active');
    }
  });
}, {rootMargin:'-10% 0px -70% 0px'});
sections.forEach(s => io.observe(s));

/* ---------- Search ---------- */
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  sections.forEach((sec, idx) => {
    let anyVisible = false;
    sec.querySelectorAll('[data-search]').forEach(node => {
      const match = !q || node.dataset.search.includes(q) || DATA[idx].ar.includes(q);
      node.style.display = match ? '' : 'none';
      if (match) anyVisible = true;
    });
    sec.style.display = anyVisible ? '' : 'none';
  });
});
